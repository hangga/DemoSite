version: 2.1

jobs:
  say-hello:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Say hello"
          command: "echo Hello, World!"

  malware-scan:  # ✅ Pindahkan ke level sejajar dengan say-hello
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Install ClamAV
          command: |
            sudo apt-get update
            sudo apt-get install -y clamav clamav-daemon
            sudo freshclam
      - run:
          name: Simulate malware with EICAR test file
          command: |
            mkdir -p test
            echo 'X5O!P%@AP[4\\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > test/eicar.com
      - run:
          name: Scan with ClamAV
          command: |
            clamscan -r test --infected --no-summary || (echo "❌ Malware detected!" && exit 1)

workflows:
  say-hello-workflow:
    jobs:
      - say-hello
      - malware-scan:
          # filters:
          #   branches:
          #     ignore:
          #       - main
