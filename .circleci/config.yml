version: 2.1

jobs:
  say-hello:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Say hello"
          command: "echo Hello, World!"

  malware-scan:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Install ClamAV
          command: |
            sudo apt-get update
            sudo apt-get install -y clamav clamav-daemon
            sudo freshclam
      - run:
          name: Scan with ClamAV
          command: |
            echo "🔍 Starting malware scan in the 'test' directory..."
            clamscan -r test --infected > scan-report.txt || true

            if grep -q "FOUND" scan-report.txt; then
              echo "❌ Malware detected!"
              echo "🦠 Infected files:"
              grep "FOUND" scan-report.txt
              echo ""
              echo "📋 Scan summary:"
              grep -A 10 "SCAN SUMMARY" scan-report.txt
              exit 1
            else
              echo "✅ No malware found."
              grep -A 10 "SCAN SUMMARY" scan-report.txt
            fi
      - persist_to_workspace:
          root: .
          paths:
            - scan-report.txt
      - store_artifacts:
          path: scan-report.txt
          destination: clamav-scan-report

workflows:
  say-hello-workflow:
    jobs:
      - say-hello
      - malware-scan
